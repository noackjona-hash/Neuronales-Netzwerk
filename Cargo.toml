[package]
name = "neuro_racer"
version = "0.1.0"
edition = "2021"
authors = ["Senior Systems & ML Engineer"]
description = "2D Top-Down Car Racing Simulation with Neural Networks and Genetic Algorithm from scratch in Rust"

[dependencies]
macroquad = "0.4.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

